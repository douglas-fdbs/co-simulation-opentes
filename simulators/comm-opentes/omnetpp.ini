[General]
network = CoSimulationNetwork
scheduler-class = "omnetpp::cSequentialScheduler"
sim-time-limit = 1000s

# Semente fixa: torna o jitter/perda REPRODUTIVEL entre execucoes (mesmo padrao
# de rede a cada run), sem deixar de ser estocastico ao longo do tempo.
seed-set = 0
seed-0-mt = 1

# Largura de banda
**.node_0.bandwidth_bps = 50000.0

# Perda de pacotes: PARAMETRO DE MODELO da rede de comunicacao (qualidade do
# canal), NAO uma saida da co-simulacao. Valor herdado do modelo do TSCC (0.15 =
# 15%); deve ser calibrado conforme a rede real da aplicacao. Use 0.0 apenas para
# o caso idealizado (canal perfeito).
**.node_0.drop_probability = 0.15

# Jitter: Injeta uma média de 50ms de atraso caótico nas filas
**.node_0.jitter_mean = 0.05
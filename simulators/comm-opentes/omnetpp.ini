[General]
# ---------------------------------------------------------------------------
# Rede LPWA 6TiSCH (IEEE 802.15.4g, TSCH com salto de canal) como servidor de
# rotas para os agentes do mercado. Modelo da subsecao 6.1.5 da tese de Lucas S.
# Melo (2022), aplicado aqui as posicoes do IEEE 13.
#
# Nao participa do passo do Mosaik: a negociacao inteira acontece DENTRO de um
# passo de 15 min, com o relogio da co-simulacao parado, entao os agentes PADE
# consultam esta rede por ZMQ a cada envio. Ver Tisch.cc.
# ---------------------------------------------------------------------------
network = TischNetwork
scheduler-class = "omnetpp::cSequentialScheduler"

# O tempo avanca por consulta de rota e NAO volta ao zero entre consultas: cada
# mensagem empurra o relogio pelo seu proprio atraso, e uma negociacao inteira
# soma milhoes de segundos simulados. No padrao de picossegundos o simtime_t de
# 64 bits estoura em cerca de 9,2e6 s (106 dias) e a simulacao morre no meio da
# negociacao; em nanossegundos o teto sobe para 9,2e9 s, com resolucao de sobra
# para uma rede cujo slotframe e de 4 s.
simtime-scale = -9
sim-time-limit = 1000000000s

# Semente fixa: o sombreamento de Pister-Hack de cada par de agentes e sorteado
# com ela, entao a topologia de radio e a mesma em toda execucao.
seed-set = 0
seed-0-mt = 1

# Topologia: as posicoes dos agentes saem do circuito (gen_ieee13_market.py). Sem
# arquivo de adjacencia, os enlaces sao os pares com PER abaixo de 0,5, e o
# servidor grava em `links_csv` a rede que de fato simulou.
**.tisch.positions_file = "/grid-data/13Bus/nodes_xy.csv"
**.tisch.adjacency_file = ""
**.tisch.links_csv = "/grid-data/13Bus/tisch_links.csv"

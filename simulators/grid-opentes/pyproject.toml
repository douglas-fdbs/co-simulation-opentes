[project]
name = "grid-opentes"
version = "0.1.0"
description = "Simulador da rede elétrica (OpenDSS) da integração OpenTES."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mosaik==3.5.0",
    "mosaik-api==3.0.6",
    "pandas>=2.3.2",
    "py-dss-interface>=2.3.0",
    "setuptools==69.5.1",
]

# ============================
# Build e Setuptools
# ============================
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Informa ao setuptools para encontrar os pacotes dentro da pasta 'src'.
# Essencial para a estrutura de layout com 'src/'.
where = ["src"]

[tool.setuptools]
# Mapeia o diretório raiz de pacotes para 'src'.
package-dir = { "" = "src" }

site_name: OpenTES
site_description: >-
  Co-simulação de um mercado transativo sobre a IEEE 13 barras desequilibrada:
  agentes PADE, OpenDSS, OMNeT++ e Mosaik, com preço sombra por fase.
site_author: Time TTESO, GREI/UFC
repo_url: https://github.com/grei-ufc/co-simulation-opentes
repo_name: grei-ufc/co-simulation-opentes
edit_uri: edit/main/docs/paginas/
copyright: GREI, Grupo de Redes Elétricas Inteligentes, Universidade Federal do Ceará

# Tudo o que e da documentacao fica em docs/: o conteudo em docs/paginas/ e o
# site compilado em docs/site/ (produto de compilacao, fora do git).
#   mkdocs serve -f docs/mkdocs.yml      (a partir da raiz do repositorio)
docs_dir: paginas
site_dir: site

theme:
  name: material
  language: pt-BR
  logo: assets/grei-mark.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Poppins
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: grei
      toggle:
        icon: material/weather-night
        name: Mudar para o tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para o tema claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - assets/grei.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link para esta seção
      toc_depth: 3
      # Mesma regra do GitHub: preserva acentos, para que uma âncora escrita num
      # arquivo .md funcione tanto aqui quanto na página do repositório.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search:
      lang:
        - pt
        - en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grei-ufc
      name: GREI no GitHub
    - icon: fontawesome/solid/graduation-cap
      link: https://www.ufc.br
      name: Universidade Federal do Ceará
  generator: false

nav:
  - Início: index.md
  - Instalação e execução: instalacao.md
  - A plataforma: arquitetura.md
  - O caso IEEE 13: caso.md
  - O modelo de mercado: mercado.md
  - Resultados: resultados.md

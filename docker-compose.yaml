name: opentes

# Co-simulacao do mercado transativo sobre a IEEE 13 barras. Cinco servicos, um
# por dominio:
#
#   comm       OMNeT++: rede 6TiSCH entre os agentes (so com NET_BACKEND=omnet)
#   grid       OpenDSS: o circuito, resolvido a cada passo de 15 min
#   collector  grava as tensoes e potencias de cada passo num CSV
#   pade       os agentes PADE (prosumidores, concentrador, DSO, mercado)
#   mosaik     o orquestrador: liga os agentes ao circuito no mesmo relogio
#
# Nao suba na mao: use ./run.sh, que sobe na ordem certa e espera cada um ficar
# pronto. Os simuladores --remote (grid e collector) aceitam UMA conexao e
# encerram; nao os sonde por TCP.

services:
  comm:
    build:
      context: ./simulators/comm-opentes
      dockerfile: Dockerfile
    image: opentes/comm:local
    container_name: opentes-comm
    expose:
      - "5556"
    volumes:
      - ./simulators/comm-opentes:/root/models
      # Posicoes dos agentes e saida `tisch_links.csv` (a rede de radio simulada).
      - ./simulators/grid-opentes/src/data:/grid-data
    command: >-
      bash -lc "source /root/omnetpp/setenv &&
      opp_makemake -f --deep -O out -o sim_exec -lzmq && make -j4 &&
      ./sim_exec -u Cmdenv -c General"
    networks:
      - opentes-net

  grid:
    build:
      context: ./simulators/grid-opentes
      dockerfile: Dockerfile
    image: opentes/grid:local
    container_name: opentes-grid
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1   # nao grava .pyc no src montado
    volumes:
      - ./simulators/grid-opentes/src:/app/src
    command: python -u -m simulators.opendss_simulator --remote 0.0.0.0:5671
    expose:
      - "5671"
    networks:
      - opentes-net

  collector:
    build:
      context: ./simulators/mosaik-opentes
      dockerfile: Dockerfile
    image: opentes/mosaik:local
    container_name: opentes-collector
    volumes:
      - ./simulators/mosaik-opentes:/app
      - ./output:/app/output
    command: python -u collectors/elec_collector.py --remote 0.0.0.0:5673
    expose:
      - "5673"
    networks:
      - opentes-net

  pade:
    build:
      context: ./simulators/pade-opentes
      dockerfile: Dockerfile
    image: opentes/pade:local
    container_name: opentes-pade
    environment:
      - PADE_PORT=5678
      - AMS_PORT=8000
      - AGENT_STEP_SIZE=900
      - MARKET_OPENTES_PATH=/market
      - MARKET_CONFIG=/grid-data/13Bus/config.json
      - MARKET_DATA_DIR=/grid-data/13Bus
      - MARKET_GRID_DIR=/grid-data/13Bus
      - MARKET_CIRCUIT=/grid-data/13Bus/Master.dss
      # Onde o agente de mercado grava o `run.json` (historico da negociacao e da
      # operacao). O run.sh aponta para a mesma pasta dos resultados eletricos.
      - MARKET_RUN_DIR=${MARKET_RUN_DIR:-/app/output/market}
      # Analise por fase (padrao): o DSO vigia a tensao de cada fase e o preco
      # sombra e por (barra, fase). 0 volta a formulacao da tese, por barra, com
      # a media das fases. Ver docs/paginas/mercado.md.
      - MARKET_FASE=${MARKET_FASE:-1}
      # Como o armazenamento injeta nas fases: `independente` (inversor de quatro
      # fios, cada fase despachada separadamente) ou `equilibrado` (tres fios,
      # potencia igual nas fases).
      - MARKET_DISPOSITIVO=${MARKET_DISPOSITIVO:-independente}
      # Regulador: `previsao` aplica as derivacoes do ponto de operacao da
      # previsao (as da matriz de sensibilidade); `neutro` as deixa em 0.
      - MARKET_REGULADOR=${MARKET_REGULADOR:-previsao}
      # Teto de rodadas da decomposicao dual. Por no a IEEE 13 converge em 81
      # rodadas e por fase em 66; o teto fica com folga.
      - MARKET_MAX_ROUNDS=${MARKET_MAX_ROUNDS:-150}
      - MARKET_ALPHA=${MARKET_ALPHA:-0.6}
      - MARKET_EPS=${MARKET_EPS:-1e-3}
      - MARKET_SCENARIOS=${MARKET_SCENARIOS:-1}
      - MARKET_NEGOTIATE=${MARKET_NEGOTIATE:-1}
      - MARKET_OPERATION=${MARKET_OPERATION:-1}
      - MARKET_REALIZED=${MARKET_REALIZED:-1}
      # Como a demanda realizada difere da programada: `perturb` e o mecanismo
      # da tese, que altera a programacao em ate +/-10%.
      - MARKET_REALIZED_MODE=${MARKET_REALIZED_MODE:-perturb}
      - MARKET_REALIZED_SPREAD=${MARKET_REALIZED_SPREAD:-0.10}
      - MARKET_REALIZED_DAY=${MARKET_REALIZED_DAY:-9}
      # Margem aplicada aos limites de tensao dentro do modelo do DSO, contra o
      # erro da linearizacao.
      - MARKET_V_BACKOFF=${MARKET_V_BACKOFF:-1e-3}
      # Limiar de ACAO da fase de operacao; o limite continua 0,97 e 1,03.
      - MARKET_V_ACAO_MIN=${MARKET_V_ACAO_MIN:-0.971}
      - MARKET_V_ACAO_MAX=${MARKET_V_ACAO_MAX:-1.03}
      # O CPLEX vem do host por volume: licenca academica e pessoal, nao entra
      # na imagem nem no repositorio.
      - MARKET_SOLVER=${MARKET_SOLVER:-cplex}
      - MARKET_SOLVER_PATH=/opt/cplex/bin/x86-64_linux/cplex
      # Fator de potencia do armazenamento. `none` e a hipotese dQ = 0 da tese.
      - MARKET_STORAGE_PF=${MARKET_STORAGE_PF:-none}
      # Camada de rede entre os agentes: `ideal` (entrega imediata), `lossy`
      # (perda e atraso sorteados) ou `omnet` (a rede 6TiSCH do servico comm).
      - NET_BACKEND=${NET_BACKEND:-ideal}
      - NET_TIME_SCALE=${NET_TIME_SCALE:-1.0}
      - NET_TRACE=${NET_TRACE:-}
      # Tamanho informado a rede: `real` usa o conteudo serializado; `thesis`
      # as classes de tamanho declaradas pela tese.
      - NET_MESSAGE_SIZE=${NET_MESSAGE_SIZE:-real}
      - OMNET_HOST=comm
      - OMNET_NET_PORT=5556
    expose:
      - "5678"
    volumes:
      - ./simulators/pade-opentes/agents:/app/agents
      - ./simulators/market-opentes:/market
      - ./simulators/grid-opentes/src/data:/grid-data:ro
      - ./output:/app/output
      - ${CPLEX_HOME:-/nonexistent}:/opt/cplex:ro
    command: python3 agents/market_agents.py
    networks:
      - opentes-net

  mosaik:
    build:
      context: ./simulators/mosaik-opentes
      dockerfile: Dockerfile
    image: opentes/mosaik:local
    container_name: opentes-mosaik
    depends_on:
      - pade
      - grid
      - collector
    environment:
      - MOSAIK_OUTPUT_DIR=${MOSAIK_OUTPUT_DIR:-/app/output/market}
      - MOSAIK_N_PASSOS=${MOSAIK_N_PASSOS:-96}
      - MOSAIK_STEP_SIZE=900
      - RESULT_TAG=${RESULT_TAG:-negociado}
      - MARKET_CIRCUIT=/app/src/data/13Bus/Master.dss
      - MARKET_FASE=${MARKET_FASE:-1}
      - MARKET_REGULADOR=${MARKET_REGULADOR:-previsao}
      - PADE_HOST=pade
      - PADE_PORT=5678
      - OPENDSS_HOST=grid
      - ELEC_COLLECTOR_HOST=collector
    volumes:
      - ./simulators/mosaik-opentes:/app
      - ./output:/app/output
    command: python -u scenarios/market.py
    networks:
      - opentes-net

networks:
  opentes-net:
    driver: bridge

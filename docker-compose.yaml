name: opentes-integration

x-tsre-simulator: &tsre-simulator
  build:
    context: ./simulators_teams/grid-opentes
    dockerfile: Dockerfile
  image: opentes/grid:local
  networks:
    - opentes-net
  environment:
    - PYTHONUNBUFFERED=1
  volumes:
    - ./simulators_teams/grid-opentes/src:/app/src

services:
  comm:
    build:
      context: ./simulators_teams/comm-opentes
      dockerfile: Dockerfile
    image: opentes/comm:local
    container_name: opentes-comm
    expose:
      - "5555"
    ports:
      - "5555:5555"
    volumes:
      - ./simulators_teams/comm-opentes:/root/models
    networks:
      - opentes-net

  pade:
    build:
      context: ./simulators_teams/pade-opentes
      dockerfile: Dockerfile
    image: opentes/pade:local
    container_name: opentes-pade
    environment:
      - NUM_PERIFERICOS=50
    expose:
      - "5678"
    ports:
      - "15678:5678"
    volumes:
      - ./simulators_teams/pade-opentes/agents:/app/agents
    command: python3 agents/pade_star.py
    networks:
      - opentes-net

  pade-controller:
    image: opentes/pade:local
    build:
      context: ./simulators_teams/pade-opentes
      dockerfile: Dockerfile
    container_name: opentes-pade-controller
    profiles:
      - controller
      - controller-demo
      - integrated
    environment:
      - CONTROLLER_HOST=0.0.0.0
      - CONTROLLER_PORT=5681
      - AMS_HOST=0.0.0.0
      - AMS_PORT=8002
      - CONTROLLER_STEP_SIZE=900
    expose:
      - "5681"
    ports:
      - "15681:5681"
    volumes:
      - ./simulators_teams/pade-opentes/agents:/app/agents
    command: python3 agents/controller_agent.py
    networks:
      - opentes-net

  mosaik:
    build:
      context: ./simulators_teams/mosaik-opentes
      dockerfile: Dockerfile
    image: opentes/mosaik:local
    container_name: opentes-mosaik
    depends_on:
      - comm
      - pade
    environment:
      - MOSAIK_SCENARIO=scenarios/star.py
      - NUM_PERIFERICOS=50
      - OMNET_HOST=comm
      - OMNET_PORT=5555
      - PADE_HOST=pade
      - PADE_PORT=5678
    volumes:
      - ./simulators_teams/mosaik-opentes:/app
      - ./output:/app/output
      - ./simulators_teams/grid-opentes/src/data:/grid-data:ro
    command: sh -c "python -u scenarios/star.py && python plot_results_star.py"
    networks:
      - opentes-net

  elec-collector:
    image: opentes/mosaik:local
    build:
      context: ./simulators_teams/mosaik-opentes
      dockerfile: Dockerfile
    container_name: opentes-elec-collector
    profiles:
      - ieee13
      - controller-demo
      - integrated
    expose:
      - "5673"
    ports:
      - "5673:5673"
    volumes:
      - ./simulators_teams/mosaik-opentes:/app
      - ./output:/app/output
    command: python -u collectors/elec_collector.py --remote 0.0.0.0:5673
    networks:
      - opentes-net

  mosaik-ieee13:
    image: opentes/mosaik:local
    build:
      context: ./simulators_teams/mosaik-opentes
      dockerfile: Dockerfile
    container_name: opentes-mosaik-ieee13
    profiles:
      - ieee13
    depends_on:
      - opendss
      - pv-panel
      - smart-inverter
      - csv-data-1
      - csv-data-2
      - elec-collector
    environment:
      - MOSAIK_SCENARIO=scenarios/ieee13_smart_pv.py
      - MOSAIK_OUTPUT_DIR=/app/output
      - GRID_DATA_DIR=/grid-data/13Bus
      - ELEC_COLLECTOR_HOST=elec-collector
    volumes:
      - ./simulators_teams/mosaik-opentes:/app
      - ./output:/app/output
      - ./simulators_teams/grid-opentes/src/data:/grid-data:ro
    networks:
      - opentes-net

  mosaik-controller-demo:
    image: opentes/mosaik:local
    build:
      context: ./simulators_teams/mosaik-opentes
      dockerfile: Dockerfile
    container_name: opentes-mosaik-controller-demo
    profiles:
      - controller-demo
    depends_on:
      - battery
      - csv-data-1
      - pade-controller
      - elec-collector
    environment:
      - MOSAIK_SCENARIO=scenarios/battery_controller_demo.py
      - MOSAIK_OUTPUT_DIR=/app/output
      - BATTERY_HOST=battery
      - CSV_CURVE_HOST=csv-data-1
      - CONTROLLER_HOST_M=pade-controller
      - ELEC_COLLECTOR_HOST=elec-collector
    volumes:
      - ./simulators_teams/mosaik-opentes:/app
      - ./output:/app/output
      - ./simulators_teams/grid-opentes/src/data:/grid-data:ro
    networks:
      - opentes-net

  pade-integrated:
    image: opentes/pade:local
    build:
      context: ./simulators_teams/pade-opentes
      dockerfile: Dockerfile
    container_name: opentes-pade-integrated
    profiles:
      - integrated
    environment:
      - NUM_PERIFERICOS=5
      - PADE_STEP=300
    expose:
      - "5678"
    ports:
      - "15679:5678"
    volumes:
      - ./simulators_teams/pade-opentes/agents:/app/agents
    command: python3 agents/pade_star.py
    networks:
      - opentes-net

  mosaik-integrated:
    image: opentes/mosaik:local
    build:
      context: ./simulators_teams/mosaik-opentes
      dockerfile: Dockerfile
    container_name: opentes-mosaik-integrated
    profiles:
      - integrated
    depends_on:
      - comm
      - pade-integrated
      - opendss
      - pv-panel
      - smart-inverter
      - csv-data-1
      - csv-data-2
      - elec-collector
    environment:
      - MOSAIK_SCENARIO=scenarios/ieee13_integrated.py
      - MOSAIK_OUTPUT_DIR=/app/output
      - NUM_PERIFERICOS=5
      - OMNET_HOST=comm
      - OMNET_PORT=5555
      - OMNET_STEP=300
      - PADE_HOST=pade-integrated
      - PADE_PORT=5678
      - ELEC_COLLECTOR_HOST=elec-collector
    volumes:
      - ./simulators_teams/mosaik-opentes:/app
      - ./output:/app/output
      - ./simulators_teams/grid-opentes/src/data:/grid-data:ro
    networks:
      - opentes-net

  opendss:
    <<: *tsre-simulator
    container_name: opentes-grid-opendss
    command: python -u -m simulators.opendss_simulator --remote 0.0.0.0:5671
    ports:
      - "5671:5671"

  battery:
    <<: *tsre-simulator
    container_name: opentes-grid-battery
    command: python src/simulators/battery_sim.py --remote 0.0.0.0:5672
    ports:
      - "5672:5672"

  csv-data-1:
    <<: *tsre-simulator
    container_name: opentes-grid-csv-data-1
    command: python src/simulators/csv_sim_pandas.py --remote 0.0.0.0:5675
    ports:
      - "5675:5675"

  csv-data-2:
    <<: *tsre-simulator
    container_name: opentes-grid-csv-data-2
    command: python src/simulators/csv_sim_pandas.py --remote 0.0.0.0:5676
    ports:
      - "5676:5676"

  inverter-std:
    <<: *tsre-simulator
    container_name: opentes-grid-inverter-std
    command: python src/simulators/inverter_simulator.py --remote 0.0.0.0:5677
    ports:
      - "5677:5677"

  pv-panel:
    <<: *tsre-simulator
    container_name: opentes-grid-pv-panel
    command: python src/simulators/pv_panel_simulator.py --remote 0.0.0.0:5678
    ports:
      - "5678:5678"

  regulator:
    <<: *tsre-simulator
    container_name: opentes-grid-regulator
    command: python src/simulators/regulator_control.py --remote 0.0.0.0:5679
    ports:
      - "5679:5679"

  smart-inverter:
    <<: *tsre-simulator
    container_name: opentes-grid-smart-inverter
    command: python src/simulators/smart_inverter_simulator.py --remote 0.0.0.0:5680
    ports:
      - "5680:5680"

networks:
  opentes-net:
    driver: bridge
